# Suppress DWARF unwind tables in C dependencies of the musl builds
# (ADR-0007 addendum 2026-11-21; see docs/benchmarks/binary-size.md).
#
# panic=abort already stops rustc from emitting unwind tables for
# workspace crates, but C deps (boring-sys, zstd-sys, libmimalloc-sys,
# ring, blake3) compile with their toolchain defaults, which emit
# ~1.3 MiB of .eh_frame/.eh_frame_hdr/.gcc_except_table into the linked
# binary. Both build frontends read target-qualified env vars — cc reads
# CFLAGS_<target>/CXXFLAGS_<target> and cmake-rs merges them into
# -DCMAKE_C_FLAGS/-DCMAKE_CXX_FLAGS — so setting them here reaches every
# C object without wrapper scripts or patches.
#
# The target-qualified names confine the effect to cross builds of that
# target: host compilations look up CFLAGS_<host-triple>, so these vars
# are inert for host builds and build-script (host) compilations.
# [env] does not override values already present in the environment —
# an operator's own CFLAGS still wins. -fno-exceptions joins CXXFLAGS
# because nothing in the dep tree throws (BoringSSL disables exceptions
# in its own crypto/fipsmodule flags already); it removes the remaining
# .gcc_except_table payload and the dead landing-pad code.
#
# Residual: prebuilt std-family rlib objects and zig-bundled musl libc
# objects still ship .eh_frame (~0.9 MiB on aarch64) — removing those
# needs -Zbuild-std (nightly) or upstream zig changes; post-link section
# removal cannot reclaim bytes inside PT_LOAD segments.
[env]
CFLAGS_aarch64_unknown_linux_musl = "-fno-unwind-tables -fno-asynchronous-unwind-tables"
CXXFLAGS_aarch64_unknown_linux_musl = "-fno-unwind-tables -fno-asynchronous-unwind-tables -fno-exceptions"
CFLAGS_x86_64_unknown_linux_musl = "-fno-unwind-tables -fno-asynchronous-unwind-tables"
CXXFLAGS_x86_64_unknown_linux_musl = "-fno-unwind-tables -fno-asynchronous-unwind-tables -fno-exceptions"
