# W4 DNS benchmark config — used by meow-bench --dns-config.
#
# fake-ip mode is deliberate: every A query is answered locally from the
# pool (allocation + reverse mapping), so the workload needs no external
# upstream and directly exercises the fake-IP path. mihomo understands
# the same keys, so one config serves both targets.
mixed-port: 17891
allow-lan: false
bind-address: "127.0.0.1"
mode: direct
log-level: warning
ipv6: false

dns:
  enable: true
  listen: 127.0.0.1:15353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 127.0.0.1
