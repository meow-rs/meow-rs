# UDP TPROXY variant (issues #564/#1017): the tproxy listener is declared via
# `listeners:` with `firewall: false` + `udp: true` — meow installs no
# nftables state; the test harness owns the TPROXY rules and the fwmark/policy
# routing that steer LAN UDP datagrams to :7895. `[::]` exercises one listener
# covering both families; the same port also answers TCP REDIRECT'd connections.
# The fake-ip DNS upstream is the test fixture inside the srv namespace.
mixed-port: 7890
routing-mark: 9527
mode: rule
log-level: debug
ipv6: true

listeners:
  - name: udp-tproxy
    type: tproxy
    listen: "::"
    port: 7895
    firewall: false
    udp: true
    udp-timeout: 30

dns:
  enable: true
  listen: "10.77.0.1:5356"
  enhanced-mode: fake-ip
  fake-ip-range6: "fdfe:dcba:9876::/64"
  nameserver:
    - "[fd89::1]:5353"

proxies:
  - name: "test-ss"
    type: ss
    server: "10.99.0.1"
    port: 8388
    cipher: "aes-128-gcm"
    password: "test-password"

rules:
  - "DOMAIN,echo6.test,DIRECT"
  - "MATCH,DIRECT"
