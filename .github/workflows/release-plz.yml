name: Release-plz

# Automates the bookkeeping half of a release (docs/RELEASING.md):
#
#   release-pr     on every push to main, opens or refreshes the standing
#                  `chore(release): X.Y.Z` PR (version bump, pins, Cargo.lock;
#                  config in release-plz.toml).
#   release        when that PR is merged, pushes the `vX.Y.Z` tag, then calls
#                  publish.yml (crates.io) and release.yml (GitHub release).
#   changelog-cut  on the release PR, fails until CHANGELOG.md has a
#                  `## [X.Y.Z]` section for the bumped version.
#
# Tokens: the tag is pushed with GITHUB_TOKEN, which does NOT trigger the
# `push: tags` path of publish.yml / release.yml, so this workflow calls them
# itself (exactly once). The release PR is opened with RELEASE_PLZ_TOKEN when
# that secret exists (a GitHub App or fine-grained PAT, so the PR runs CI);
# otherwise with GITHUB_TOKEN, which needs "Allow GitHub Actions to create and
# approve pull requests" enabled and leaves the PR without CI until a human
# pushes to it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: [CHANGELOG.md, Cargo.toml]

permissions: {}

jobs:
  release-pr:
    name: Release PR
    if: github.event_name == 'push' && github.repository == 'meow-rs/meow-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Open or update the release PR
        uses: release-plz/action@v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release:
    name: Tag release
    if: github.event_name == 'push' && github.repository == 'meow-rs/meow-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Tags only when HEAD is the merge of a `release-plz-*` PR
      # (release_always = false); every other push is a no-op.
      - name: Tag a merged release PR
        id: rp
        uses: release-plz/action@v0.5.139
        with:
          command: release
        env:
          # Deliberately GITHUB_TOKEN even when RELEASE_PLZ_TOKEN exists: a tag
          # pushed by a PAT/App would also fire publish.yml and release.yml via
          # `push: tags`, on top of the calls below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the pushed tag
        id: tag
        if: steps.rp.outputs.releases_created == 'true'
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          tag="v${ver}"
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null || {
            echo "::error::release-plz reported a release but ${tag} is not on origin"
            exit 1
          }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Released ${tag}"

  publish:
    name: crates.io
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}

  changelog-cut:
    name: CHANGELOG has the release section
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check CHANGELOG.md for the bumped version
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if ! grep -qE "^## \[${ver//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${ver}] - YYYY-MM-DD' section: cut '## [Unreleased]' into it on this branch before merging (docs/RELEASING.md)"
            exit 1
          fi
          echo "CHANGELOG.md has the ${ver} section."
