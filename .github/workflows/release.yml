name: Release

# Builds the release artifacts and publishes the GitHub Release for a v* tag:
# on a tag push, or via workflow_call from tag-release.yml (which creates the
# tag with GITHUB_TOKEN, and such a tag push triggers no workflows). The
# release notes are the tag's CHANGELOG.md section followed by GitHub's
# generated PR list. workflow_dispatch only builds (dry run, no upload).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.3.0) — dry-run only, no upload"
        required: true
  workflow_call:
    inputs:
      release_tag:
        description: "Tag to release (vX.Y.Z); must already exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # Build matrix + packaging live in build.yml (shared with alpha.yml).
    uses: ./.github/workflows/build.yml
    with:
      # On workflow_dispatch GITHUB_REF_NAME is the *branch* name (which may
      # contain slashes and break the archive path) — use the tag input. Under
      # workflow_call it is the caller's ref (main), so use release_tag.
      ref: ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag) || github.ref_name }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package luci-app-meow ipk (arch-independent)
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash openwrt/build-ipk.sh luci --version "${version}-1" --outdir dist
          cd dist
          f="luci-app-meow_${version}-1_all.ipk"
          sha256sum "$f" > "$f.sha256"

      - name: Cache apk-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/apk-tools
          key: apk-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openwrt/install-apk-tools.sh') }}

      - name: Package luci-app-meow apk (arch-independent)
        run: |
          set -euo pipefail
          bash openwrt/install-apk-tools.sh "$HOME/.cache/apk-tools"
          version="${RELEASE_TAG#v}"
          sudo APK="$HOME/.cache/apk-tools/apk" bash openwrt/build-apk.sh luci \
            --version "${version}-r1" --outdir dist
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          f="luci-app-meow_${version}-r1_all.apk"
          sha256sum "$f" > "$f.sha256"

      - name: Write release notes
        run: |
          set -euo pipefail
          # The curated CHANGELOG.md section leads; softprops appends GitHub's
          # generated "What's Changed" list below it. Tags cut before the
          # CHANGELOG existed (<= v0.21.2) get the generated list only.
          if scripts/release/changelog-section.sh "${RELEASE_TAG#v}" >"$RUNNER_TEMP/notes.md"; then
            echo "Using the CHANGELOG.md section for ${RELEASE_TAG}."
          else
            echo "::warning::CHANGELOG.md has no section for ${RELEASE_TAG}; using generated notes only"
            : >"$RUNNER_TEMP/notes.md"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/**/*.ipk
            dist/**/*.ipk.sha256
            dist/**/*.apk
            dist/**/*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
