name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.3.0) — dry-run only, no upload"
        required: true
  # release-plz.yml calls this after pushing the tag: a GITHUB_TOKEN tag push
  # does not trigger the `push: tags` path above.
  workflow_call:
    inputs:
      release_tag:
        description: "Tag to build and publish as a GitHub release (e.g. v0.23.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    # Build matrix + packaging live in build.yml (shared with alpha.yml).
    uses: ./.github/workflows/build.yml
    with:
      # On workflow_dispatch GITHUB_REF_NAME is the *branch* name (which may
      # contain slashes and break the archive path) — use the tag input.
      ref: ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag) || github.ref_name }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    # Tag pushes and release-plz calls only; a manual dispatch is a dry run.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag || '') != ''
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package luci-app-meow ipk (arch-independent)
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash openwrt/build-ipk.sh luci --version "${version}-1" --outdir dist
          cd dist
          f="luci-app-meow_${version}-1_all.ipk"
          sha256sum "$f" > "$f.sha256"

      - name: Cache apk-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/apk-tools
          key: apk-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openwrt/install-apk-tools.sh') }}

      - name: Package luci-app-meow apk (arch-independent)
        run: |
          set -euo pipefail
          bash openwrt/install-apk-tools.sh "$HOME/.cache/apk-tools"
          version="${RELEASE_TAG#v}"
          sudo APK="$HOME/.cache/apk-tools/apk" bash openwrt/build-apk.sh luci \
            --version "${version}-r1" --outdir dist
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          f="luci-app-meow_${version}-r1_all.apk"
          sha256sum "$f" > "$f.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/**/*.ipk
            dist/**/*.ipk.sha256
            dist/**/*.apk
            dist/**/*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
