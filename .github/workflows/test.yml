name: Test

on:
  push:
    branches: [main]
    paths: ["crates/**", "tests/**", "openwrt/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/**"]
  pull_request:
    paths: ["crates/**", "tests/**", "openwrt/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/**"]

# One active run per ref: a superseded push to the same PR/branch cancels the
# in-flight run instead of racing it to completion. `push` is limited to
# `main` above, so a PR branch is tested exactly once per push (via the
# pull_request event) instead of twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No step needs write: dashboard's artifact upload works under read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  luci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: openwrt/luci-app-meow/package-lock.json
      - name: Check vendored YAML bundle is reproducible
        run: |
          npm --prefix openwrt/luci-app-meow ci
          npm --prefix openwrt/luci-app-meow run build
          git diff --exit-code -- openwrt/luci-app-meow/htdocs/luci-static/resources/tools/meow_yaml.js openwrt/luci-app-meow/htdocs/luci-static/resources/tools/meow_yaml.LICENSE
      - name: LuCI syntax, ACL and save regression tests
        run: bash tests/test_luci_meow.sh

  dashboard:
    # Playwright 1.58.2 (tests/dashboard/package.json) cannot install its
    # browser dependencies on ubuntu-26.04, which `ubuntu-latest` is moving
    # to; return to `ubuntu-latest` with a Playwright that supports it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dashboard unit and browser tests
        run: npm test
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-test-results
          path: tests/dashboard/test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # This gate runs on the rust-toolchain.toml pin via rustup's
      # toolchain-file resolution (the file beats `rustup default`; the
      # @stable step just provides rustup + a fallback toolchain — no
      # `components:`, the pin declares its own). Mirrored on floating
      # stable by toolchain-drift.yml — keep the step set in sync.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      # Also stands in for the per-crate `cargo check --all-features` legs
      # that used to run in the test job (transport G7, VLESS G3): clippy is
      # a strict superset of check.
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      # `minimal` leaves out `logbook`, but every workspace run above turns it
      # on (meow-api's dev-dependency enables it), so the stub that stands in
      # for it (`meow-common/src/logbook/disabled.rs`) needs its own run.
      - name: Clippy (meow-common without logbook)
        run: cargo clippy -p meow-common --all-targets -- -D warnings

      - name: Doc check
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  test:
    # Ubuntu 26.04, which `ubuntu-latest` is moving to, no longer packages
    # simple-obfs (installed below for the SS integration tests); return to
    # `ubuntu-latest` once it is built some other way.
    runs-on: ubuntu-24.04
    needs: lint
    env:
      # Pinned external test-peer versions — one source for the download
      # URL, the cache key and the install step, so a version bump can
      # never leave a stale key behind. Keep in sync with
      # SINGBOX_VERSION in crates/meow-app/tests/smux_singbox_integration.rs.
      SINGBOX_VERSION: "1.14.0"
      GOST_VERSION: "3.3.0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # cargo-nextest: per-test process isolation + `--retries 2 --no-fail-fast` absorbs
      # the tail-latency/UDP-drop flakes these real-I/O suites are prone to
      # on shared runners (e.g. snell_v3_docker_udp read timeouts).
      # The release-asset download is itself a flake edge (GitHub CDN 504s)
      # — cache the installed binary; install-action drops it in
      # ~/.cargo/bin when that is on PATH, else ~/.install-action/bin.
      # Bump the -v1 suffix to refresh the cached binary.
      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@v4
        with:
          path: |
            ~/.install-action/bin/cargo-nextest*
            ~/.cargo/bin/cargo-nextest*
          key: install-action-nextest-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore cargo-nextest PATH
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os != 'Windows'
        # Either install dir may hold the binary depending on whether
        # ~/.cargo/bin was already on PATH — add both.
        run: |
          echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore cargo-nextest PATH (Windows)
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os == 'Windows'
        run: |
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.install-action\bin"

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@nextest

      - name: Cache ssserver binary
        id: cache-ssserver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ssserver
          key: ssserver-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install ssserver
        if: steps.cache-ssserver.outputs.cache-hit != 'true'
        # --force: on a Cargo.lock change this step's cache misses, but the
        # rust-cache restore may already have an ssserver in ~/.cargo/bin,
        # and a plain `cargo install` refuses to overwrite it.
        run: cargo install shadowsocks-rust --features "stream-cipher aead-cipher-2022" --locked --force

      - name: Install simple-obfs (obfs-local / obfs-server)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends simple-obfs
          # Fail fast if either binary is missing — the obfs integration tests
          # rely on both being on PATH (otherwise they would silently SKIP).
          command -v obfs-local
          command -v obfs-server

      - name: Cache sing-box binary
        id: cache-sing-box
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-peers/sing-box
          key: sing-box-${{ env.SINGBOX_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # Real-server smux E2E (smux_singbox_integration) runs against this
      # pinned sing-box and REFUSES to silently skip when it is missing,
      # so a green run always means real-server smux was exercised. The
      # version pin lives in this job's env (see above).
      - name: Install sing-box (real-server smux E2E)
        run: |
          set -euo pipefail
          # On a cache hit the staged binary is already in place — skip
          # the release-asset download entirely (GitHub CDN 504 shield).
          if [ ! -x "$RUNNER_TEMP/ci-peers/sing-box" ]; then
            curl -fsSL -o /tmp/sing-box.tar.gz \
              "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
            tar -xzf /tmp/sing-box.tar.gz -C /tmp
            mkdir -p "$RUNNER_TEMP/ci-peers"
            cp "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" "$RUNNER_TEMP/ci-peers/sing-box"
          fi
          sudo install -m 755 "$RUNNER_TEMP/ci-peers/sing-box" /usr/local/bin/sing-box
          command -v sing-box

      - name: Cache gost binary
        id: cache-gost
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-peers/gost
          key: gost-${{ env.GOST_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # Real-peer gost-plugin interop (gost_plugin_integration) runs against
      # this pinned gost binary — with it on PATH the suite exercises a real
      # `ss+mws` server instead of printing SKIP.
      - name: Install gost (gost-plugin interop E2E)
        run: |
          set -euo pipefail
          if [ ! -x "$RUNNER_TEMP/ci-peers/gost" ]; then
            curl -fsSL -o /tmp/gost.tar.gz \
              "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/gost.tar.gz -C /tmp gost
            mkdir -p "$RUNNER_TEMP/ci-peers"
            cp /tmp/gost "$RUNNER_TEMP/ci-peers/gost"
          fi
          sudo install -m 755 "$RUNNER_TEMP/ci-peers/gost" /usr/local/bin/gost
          command -v gost

      # hashFiles rotates the key whenever the pin/version/SHA256 in the
      # fetch script changes — the cached dir is exactly what the script
      # would have produced.
      - name: Cache v2ray-plugin
        id: cache-v2ray-plugin
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/v2ray-plugin
          key: v2ray-plugin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-v2ray-plugin.sh') }}

      # v2ray_plugin_integration runs ssserver with this official
      # v2ray-plugin as its server plugin (default options, so Mux.Cool,
      # plus `mux=0` legs); V2RAY_PLUGIN_BIN on the test step points the
      # suite at it, and the suite fails when it is unset (no silent skip).
      - name: Fetch official v2ray-plugin (pinned, SHA256 verified)
        if: steps.cache-v2ray-plugin.outputs.cache-hit != 'true'
        run: bash scripts/fetch-v2ray-plugin.sh "$RUNNER_TEMP/v2ray-plugin"

      # The restls upstream-interop leg runs against a real
      # metacubex/restls-client-go server built from the committed Go
      # harness; RESTLS_SERVER_BIN on the test step tells the suite where
      # it lives (the test fails when the env is unset — no silent skip).
      - name: Set up Go (restls interop harness)
        uses: actions/setup-go@v5
        with:
          go-version-file: crates/meow-transport/tests/support/restls-server/go.mod
          cache: false

      - name: Build restls-server harness
        run: go build -C crates/meow-transport/tests/support/restls-server -o "$RUNNER_TEMP/restls-server" .

      # The jls upstream-interop leg runs against a real metacubex/jls-tls
      # server built from the committed Go harness; JLS_SERVER_BIN on the
      # test step tells the suite where it lives (the test fails when the
      # env is unset — no silent skip).
      - name: Set up Go (jls interop harness)
        uses: actions/setup-go@v5
        with:
          go-version-file: crates/meow-transport/tests/support/jls-server/go.mod
          cache: false

      - name: Build jls-server harness
        run: go build -C crates/meow-transport/tests/support/jls-server -o "$RUNNER_TEMP/jls-server" .

      # The kcptun e2e suite drives the full SS→smux→snappy→KCP→crypt/FEC
      # stack against a real upstream Go peer (kcp-go + xtaci/smux +
      # go-shadowsocks2), so build the in-tree harness. Without
      # KCPTUN_SERVER_BIN every leg loud-skips — a green run here always
      # means real wire interop was exercised.
      - name: Set up Go (kcptun harness)
        uses: actions/setup-go@v5
        with:
          go-version-file: crates/meow-proxy/tests/support/kcptun-server/go.mod

      - name: Build kcptun interop harness
        working-directory: crates/meow-proxy/tests/support/kcptun-server
        run: go build -o "$RUNNER_TEMP/kcptun-server" .

      - name: Build
        run: cargo build --tests

      - name: Cache TrustTunnel endpoint
        id: cache-trusttunnel
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trusttunnel
          key: trusttunnel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-trusttunnel-endpoint.sh') }}

      - name: Fetch official TrustTunnel endpoint (pinned, SHA256 verified)
        if: steps.cache-trusttunnel.outputs.cache-hit != 'true'
        run: bash scripts/fetch-trusttunnel-endpoint.sh "$RUNNER_TEMP/trusttunnel"

      - name: TrustTunnel opt-in protocol and configuration tests
        env:
          TRUSTTUNNEL_SERVER_BIN: ${{ runner.temp }}/trusttunnel/trusttunnel_endpoint
        run: |
          cargo nextest run -p meow-proxy --no-default-features --features trusttunnel --lib trusttunnel --retries 2 --no-fail-fast
          cargo nextest run -p meow-proxy --no-default-features --features trusttunnel --test trusttunnel_integration --retries 2 --no-fail-fast
          cargo nextest run -p meow-proxy --no-default-features --features trusttunnel --test trusttunnel_e2e --retries 2 --no-fail-fast
          cargo nextest run -p meow-config --features trusttunnel --test trusttunnel_config_test --retries 2 --no-fail-fast
          cargo nextest run -p meow-config --no-default-features --test trusttunnel_config_test --retries 2 --no-fail-fast
          cargo nextest run -p meow-api --features meow-config/trusttunnel --test api_test trusttunnel_provider --retries 2 --no-fail-fast
          # The HTTP/3 transport is a second opt-in feature on top of it, so
          # the quiche driver, its in-tree HTTP/3 peer tests, the official
          # endpoint's `[listen_protocols.quic]` interop leg and the `quic:`
          # parser contract are invisible to every run above.
          cargo nextest run -p meow-proxy --no-default-features --features trusttunnel-h3 --lib trusttunnel --retries 2 --no-fail-fast
          cargo nextest run -p meow-proxy --no-default-features --features trusttunnel-h3 --test trusttunnel_e2e --retries 2 --no-fail-fast
          cargo nextest run -p meow-config --features trusttunnel-h3 --test trusttunnel_config_test --retries 2 --no-fail-fast
          # meow-config's own unit tests embed TrustTunnel fixtures too; only
          # this scope compiles them with every TrustTunnel transport on.
          cargo nextest run -p meow-config --features trusttunnel-h3 --lib --retries 2 --no-fail-fast

      # WireGuard (issue #899) is opt-in behind `wireguard` (meow-app `full`
      # only, never `minimal`): the vendored boringtun crate, the smoltcp
      # pump, the loopback adapter integration and both parser legs compile
      # only under explicit feature runs. The first two lines pin the crypto
      # boundary — boringtun's ring backend was replaced by crypto.rs and
      # must never creep back through a dependency bump.
      - name: WireGuard opt-in protocol and configuration tests
        run: |
          cargo clippy -p meow-wireguard --all-targets -- -D warnings
          cargo clippy -p meow-proxy --no-default-features --features wireguard --all-targets -- -D warnings
          # Assign first so bash -e catches a cargo-tree failure. The
          # assertion must be `if …; then exit 1`, never `! grep …`:
          # under -e a `!`-inverted status is exempt, so `! grep` mid-
          # script would print the offending dep and still pass.
          wgdeps="$(cargo tree -p meow-wireguard --edges normal)"
          if grep -wE 'ring|ring_compat|aws-lc' <<<"$wgdeps"; then
            echo "::error::ring-family dep crept into meow-wireguard"
            exit 1
          fi
          # No --lib: tests/wg_vectors.rs (the two-Tunn wire roundtrip) is
          # an integration target a --lib run would silently skip.
          cargo nextest run -p meow-wireguard --retries 2 --no-fail-fast
          # `mock-instant` un-gates the vendored rekey/retransmission timer
          # tests — dead code under every other invocation.
          cargo nextest run -p meow-wireguard --features mock-instant --lib --retries 2 --no-fail-fast
          cargo nextest run -p meow-wireguard --features wireguard-boring --retries 2 --no-fail-fast  # no --lib: keeps the wg_vectors integration target under the boring backend too
          cargo nextest run -p meow-config --features wireguard --test wireguard_config_test --retries 2 --no-fail-fast
          cargo nextest run -p meow-config --no-default-features --test wireguard_config_test --retries 2 --no-fail-fast
          # `--lib` pulls in the wireguard::pump unit tests a --test-only
          # run would silently skip.
          cargo nextest run -p meow-proxy --features wireguard --lib --test wireguard_integration --retries 2 --no-fail-fast
          # `minimal` must not pull the WG stack into its dep tree at all;
          # grep prints the offending lines on failure. Same `if` form —
          # positional luck is the only thing that made `! grep` work
          # here before (last command in the script).
          mindeps="$(cargo tree -p meow-app --no-default-features --features minimal --edges normal)"
          if grep -wE 'meow-wireguard|meow-wgstack|smoltcp' <<<"$mindeps"; then
            echo "::error::minimal feature tree pulled the WG stack"
            exit 1
          fi

      # The WireGuard *inbound* (`listeners: - type: wireguard`) is opt-in
      # behind meow-listener's `listener-wireguard` (meow-app `full`,
      # never `minimal`): the responder demux, the AnyIP smoltcp stack and
      # the inner UDP reply builder compile only under the feature run.
      # The dep-tree assertions reuse the ring-free contract — the
      # listener links the same vendored noise crate as the outbound.
      - name: WireGuard inbound listener (listener-wireguard)
        run: |
          cargo clippy -p meow-listener --no-default-features --features listener-wireguard --all-targets -- -D warnings
          cargo clippy -p meow-wgstack --all-targets -- -D warnings
          ldeps="$(cargo tree -p meow-listener --no-default-features --features listener-wireguard --edges normal)"
          if grep -wE 'ring|ring_compat|aws-lc' <<<"$ldeps"; then
            echo "::error::ring-family dep crept into the WG listener tree"
            exit 1
          fi
          sdeps="$(cargo tree -p meow-wgstack --edges normal)"
          if grep -wE 'ring|ring_compat|aws-lc' <<<"$sdeps"; then
            echo "::error::ring-family dep crept into meow-wgstack"
            exit 1
          fi
          cargo nextest run -p meow-listener --features listener-wireguard --lib --test wireguard_listener --retries 2 --no-fail-fast
          # `--features wireguard`: meow-config's default set excludes it,
          # and the x25519 self-peer test (`wg_peer_public_key_equal_own_errors`)
          # compiles only under it — same shape as the outbound leg above.
          cargo nextest run -p meow-config --features wireguard --test wireguard_listener_config_test --retries 2 --no-fail-fast
          cargo nextest run -p meow-config --no-default-features --test wireguard_listener_config_test --retries 2 --no-fail-fast

      # The QUIC DNS transports live behind meow-dns's `quic-dns` feature
      # (meow-app's `dns-quic` forwards it, and `full` carries that), so no
      # default-features invocation compiles them. The peer is an in-process
      # quiche server, so this needs no network.
      - name: DNS over QUIC / DoH3 (in-process QUIC peer)
        run: cargo nextest run -p meow-dns --features quic-dns --test quic_dns_integration --retries 2 --no-fail-fast

      # One workspace-scoped invocation for every default-features test
      # target. A single invocation keeps a single feature-resolution scope,
      # so default targets share artifacts within this invocation instead
      # of re-unifying features per `-p`-scoped step. The preceding opt-in
      # TrustTunnel checks deliberately use separate feature scopes.
      # `cargo test -p meow-dns --lib` was folded in: `--lib` already
      # runs every crate's lib tests, meow-dns included.
      - name: Unit + integration tests (default features)
        env:
          # Points restls_e2e's upstream-interop leg at the Go harness
          # built above — without it that leg fails (never silently skips).
          RESTLS_SERVER_BIN: ${{ runner.temp }}/restls-server
          # Same contract for jls_e2e's upstream-interop leg.
          JLS_SERVER_BIN: ${{ runner.temp }}/jls-server
          # And for kcptun_e2e's all-real-peer suite.
          KCPTUN_SERVER_BIN: ${{ runner.temp }}/kcptun-server
          # And for v2ray_plugin_integration's official server plugin.
          V2RAY_PLUGIN_BIN: ${{ runner.temp }}/v2ray-plugin/v2ray-plugin
        run: |
          export MEOW_TEST_OUTBOUND_INTERFACE="$(ip -4 route get 1.1.1.1 | awk '{for (i=1;i<NF;i++) if ($i=="dev") {print $(i+1); exit}}')"
          test -n "$MEOW_TEST_OUTBOUND_INTERFACE"
          cargo nextest run --lib --bin meow --bin meow-bench --bin meow-cli \
            --test direct_udp_binding \
            --test common_test \
            --test socks5_udp_user \
            --test host_validation \
            --test ss_listener_integration \
            --test dns_cache_test --test dns_response_rules \
            --test config_test \
            --test tun_config_test --test sniffer_config_test \
            --test dialer_proxy_group \
            --test statistics_test \
            --test rules_test \
            --test api_test \
            --test meow_cli_test \
            --test raii_guard_test \
            --test http_connection_close \
            --test config_persistence_test \
            --test systemd_config_test \
            --test launchd_config_test \
            --test trojan_integration \
            --test vless_config_test \
            --test vless_integration \
            --test v2ray_plugin_integration \
            --test gost_plugin_integration \
            --test shadow_tls_test \
            --test restls_e2e \
            --test jls_e2e \
            --test kcptun_e2e \
            --test pre_resolve_test \
            --test offline_config_test \
            --test subscription_refresh_test \
            --test tls_test \
            --test boring_tls_test \
            --test ws_test \
            --test crate_invariants_test \
            --test crate_publish_metadata_test \
            --test yaml_backend_test \
            --test smux_singbox_integration --retries 2 --no-fail-fast

      # `-p meow-api` builds api_test WITHOUT `listener-tun` (meow-app's
      # `full` never enters the graph), so the `cfg(not(feature =
      # "listener-tun"))` TUN-reconcile tests actually execute — in the
      # unified invocation above feature unification compiles them out.
      - name: API tests without listener-tun (TUN reconcile)
        run: cargo nextest run -p meow-api --test api_test --retries 2 --no-fail-fast

      # `yaml_boundary_test` carries the PR #827 scalar/key/tag pins
      # (source-spelling delivery, duplicate-key verdicts, tagged-key
      # checks). It is not named by the workspace invocation above, so
      # without this step a regression in those pins would only surface
      # in the nightly coverage run. The windows/macos curated lists
      # name it directly, so all three test jobs run the suite.
      - name: YAML boundary contract tests (meow-config)
        run: cargo nextest run -p meow-config --test yaml_boundary_test --retries 2 --no-fail-fast

      # `minimal` leaves out `logbook` and `traffic-ledger`, which every run
      # above unifies on; `-p meow-common` alone builds the stubs that stand
      # in for them (`meow-common/src/{logbook,traffic_ledger}/disabled.rs`).
      - name: Logbook and traffic ledger stub tests (meow-common without them)
        run: cargo nextest run -p meow-common --lib logbook traffic_ledger --retries 2 --no-fail-fast

      - name: UDP routing regression (SOCKS5, Shadowsocks, TUN)
        run: cargo nextest run -p meow-listener --all-features --lib udp_port_53 --retries 2 --no-fail-fast

      # ADR-0008 allocation-count gates. Release build: the thresholds are
      # calibrated against release codegen. The provider-backed pressure
      # test self-skips when geodata files are absent (as on CI runners);
      # the remaining gates run everywhere.
      - name: Allocation-count gates (ADR-0008)
        run: cargo nextest run -p meow-tunnel --test alloc_count_test --release --retries 2 --no-fail-fast

      # Kept as its own step: MIHOMO_REQUIRE_INTEGRATION_BINS flips *every*
      # suite that probes for external binaries from skip to fail (e.g.
      # vless_integration probes for xray, which is not installed here), so
      # it must only wrap the suite whose binaries are installed above.
      - name: Shadowsocks integration tests (incl. simple-obfs)
        env:
          # Force-fail (instead of silently SKIP) if ssserver / obfs-local /
          # obfs-server are missing on PATH — they are installed above.
          MIHOMO_REQUIRE_INTEGRATION_BINS: "1"
        run: cargo nextest run --test shadowsocks_integration --retries 2 --no-fail-fast

      - name: Docker integration tests (Hysteria2 + Snell v3–v6 + Xray VMess/VLESS encryption/Vision)
        env:
          MEOW_REQUIRE_DOCKER: "1"
        run: |
          cargo nextest run -p meow-proxy --features "hysteria2,snell,vmess,vless-encryption,vless-vision" \
            --test hysteria2_integration \
            --test snell_server_docker_integration \
            --test xray_server_docker_integration --retries 2 --no-fail-fast

      - name: AnyTLS unit and integration tests (embedded server)
        run: |
          cargo nextest run -p meow-anytls --lib --retries 2 --no-fail-fast
          cargo nextest run -p meow-proxy --features anytls --lib \
            --test anytls_integration --test anytls_leak --retries 2 --no-fail-fast

      # One invocation/feature set for the feature-gated transport suites.
      # Per-feature-combination *compile* coverage (the old G1-G6 matrix)
      # lives in the feature-powerset job; the nightly coverage workflow
      # runs these same tests under --all-features.
      - name: Transport feature-gated tests (gRPC / H2 / HTTPUpgrade / XHTTP)
        run: |
          cargo nextest run -p meow-transport --features "grpc,h2,httpupgrade,xhttp" \
            --test grpc_test \
            --test h2_test \
            --test xhttp_test \
            --test httpupgrade_test --retries 2 --no-fail-fast

  features:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: features

      - name: Cache cargo-hack
        id: cache-cargo-hack
        uses: actions/cache@v4
        with:
          path: |
            ~/.install-action/bin/cargo-hack*
            ~/.cargo/bin/cargo-hack*
          # bump the -v1 suffix to refresh the cached binary.
          key: install-action-cargo-hack-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore cargo-hack PATH
        if: steps.cache-cargo-hack.outputs.cache-hit == 'true' && runner.os != 'Windows'
        run: |
          echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore cargo-hack PATH (Windows)
        if: steps.cache-cargo-hack.outputs.cache-hit == 'true' && runner.os == 'Windows'
        run: |
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.install-action\bin"

      - name: Install cargo-hack
        if: steps.cache-cargo-hack.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@v4
        with:
          path: |
            ~/.install-action/bin/cargo-nextest*
            ~/.cargo/bin/cargo-nextest*
          key: install-action-nextest-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore cargo-nextest PATH
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os != 'Windows'
        run: |
          echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore cargo-nextest PATH (Windows)
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os == 'Windows'
        run: |
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.install-action\bin"

      # The ss-only meow-config leg below runs its reserved-plugin contract
      # tests through nextest like every other test step.
      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@nextest

      # Capped powerset: --depth 2 covers the empty set, every single feature,
      # and every pair — enough for the real-world cfg-interaction bugs while
      # keeping the leg count ~n^2 instead of ~2^n (meow-proxy: 184 legs,
      # ~297 across the four crates — cargo-hack dedups subsets that resolve
      # to identical builds). Same trade-off tokio (--depth 2 --keep-going)
      # and quinn (--depth 3 --no-dev-deps) make in their PR CI.
      # --no-dev-deps: dev-dependencies are irrelevant to a compile check and
      # dominate per-leg build time. Deeper combinations (3+ features) run
      # nightly in .github/workflows/feature-powerset-daily.yml; the
      # --all-features legs (transport G7, VLESS G3) are covered by clippy
      # --all-features in the lint job.
      - name: Feature powerset (depth 2) — meow-transport
        # `tls` is BoringSSL (boring-sys builds once and is cached across
        # legs); `boring-tls` is a no-op alias of it, so skip that duplicate.
        run: cargo hack check -p meow-transport --feature-powerset --depth 2 --no-dev-deps --exclude-features boring-tls

      - name: Feature powerset (depth 2) — meow-proxy
        run: cargo hack check -p meow-proxy --feature-powerset --depth 2 --no-dev-deps

      # `ss`-only meow-config: the reserved-plugin contract tests (built-in
      # SIP003 names never fall back to the external spawn path, compiled-out
      # names bind a dead placeholder instead of dropping the node) compile
      # only under this feature set — none of the four plugin features on —
      # and the trojan-fixture dialer/prefetch tests are cfg'd out of it.
      - name: meow-config ss-only unit tests
        run: cargo nextest run -p meow-config --no-default-features --features ss --lib --retries 2 --no-fail-fast

      - name: Feature powerset (depth 2) — meow-listener
        run: cargo hack check -p meow-listener --feature-powerset --depth 2 --no-dev-deps

      - name: Feature powerset (depth 2) — meow-dns
        run: cargo hack check -p meow-dns --feature-powerset --depth 2 --no-dev-deps

  msrv:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Read MSRV from workspace Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV: $msrv"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # rust-toolchain.toml outranks `rustup default` — a directory
      # override outranks the file, so without this the check would
      # silently run on the pin (and rust-cache would key on it too).
      - run: rustup override set ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Cargo check on MSRV toolchain
        run: cargo check --workspace --all-targets

  windows:
    runs-on: windows-latest
    needs: lint
    env:
      # Exact LLVM pin — the cache key names it, so a stale-key restore
      # can never hide a minor-version bump behind a floating "18".
      LLVM_VERSION: "18.1.8"
    steps:
      - uses: actions/checkout@v5

      # No `components:` — the clippy steps run in the checkout, where
      # rust-toolchain.toml resolves the pin and auto-installs its
      # declared components; @stable only provides rustup + a fallback.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows

      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@v4
        with:
          path: |
            ~/.install-action/bin/cargo-nextest*
            ~/.cargo/bin/cargo-nextest*
          # bump the -v1 suffix to refresh the cached binary.
          key: install-action-nextest-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore cargo-nextest PATH
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os != 'Windows'
        run: |
          echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore cargo-nextest PATH (Windows)
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os == 'Windows'
        run: |
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.install-action\bin"

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@nextest

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: "C:\\Program Files\\LLVM"
          key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}

      # Mirrors the env block install-llvm-action exports for bindgen
      # (LLVM_PATH + <bin> on PATH; lib dirs for the LLVM dylibs).
      - name: Restore LLVM environment
        if: steps.cache-llvm.outputs.cache-hit == 'true'
        run: |
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value "LLVM_PATH=C:\Program Files\LLVM"
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value "LD_LIBRARY_PATH=C:\Program Files\LLVM\lib"
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value "DYLD_LIBRARY_PATH=C:\Program Files\LLVM\lib"
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"

      # lwIP (listener-tun, in the `full` default bundle) uses bindgen.
      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Cache wintun.dll
        id: cache-wintun
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wintun
          # The DLL arch is the *target's*, named in the key — one wintun
          # arch per target triple, hashFiles rotates on the version pin.
          key: wintun-x86_64-pc-windows-msvc-${{ hashFiles('scripts/fetch-wintun.sh') }}

      - name: Fetch wintun.dll
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/wintun/wintun.dll" ]; then
            bash scripts/fetch-wintun.sh --target x86_64-pc-windows-msvc --outdir "$RUNNER_TEMP/wintun"
          fi
          echo "MEOW_WINTUN_DLL=$RUNNER_TEMP/wintun/wintun.dll" >> "$GITHUB_ENV"

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Build
        run: cargo build --tests

      # Single workspace-scoped invocation — same rationale as the ubuntu
      # test job: one feature-resolution scope, no per-step rebuilds (the
      # old `-p`-scoped steps re-unified features and spent minutes
      # relinking on the Windows runner).
      - name: Unit + integration tests (windows)
        shell: bash
        run: |
          export MEOW_TEST_OUTBOUND_INTERFACE="$(powershell.exe -NoProfile -Command '(Find-NetRoute -RemoteIPAddress 1.1.1.1 | Select-Object -First 1).InterfaceAlias' | tr -d '\r')"
          test -n "$MEOW_TEST_OUTBOUND_INTERFACE"
          cargo nextest run --lib --bin meow --bin meow-bench --bin meow-cli \
            --test direct_udp_binding \
            --test common_test \
            --test config_test \
            --test rules_test \
            --test api_test \
            --test meow_cli_test \
            --test trojan_integration \
            --test tls_test \
            --test boring_tls_test \
            --test ws_test \
            --test crate_publish_metadata_test --test yaml_backend_test \
            --test yaml_boundary_test --retries 2 --no-fail-fast

      # TUN inbound tests: `listener-tun` is not a default feature, so the
      # workspace --lib leg above never compiles or runs the tun module's
      # tests. This leg covers the Windows-only DnsGuard logic (backup
      # filtering, batched restore-script generation, and a read-only smoke
      # test of the real PowerShell/registry backup path) plus the
      # platform-neutral TUN routing-loop guard.
      - name: meow-listener TUN tests (listener-tun)
        run: cargo nextest run -p meow-listener --features listener-tun --lib --retries 2 --no-fail-fast

      # Creates real Wintun adapters, which needs Administrator (the
      # hosted runner has it), so the tests are `#[ignore]`d for local
      # runs: the addresses must come up Preferred, not tentative, and
      # replace the ones a reopened adapter still carries. Each test runs
      # in its own step invoking nextest with an exact-name filter — a
      # rename fails that step with "no tests run" (--no-tests=fail)
      # instead of a module-path substring silently matching nothing — or
      # an OR'd filter still running the survivors and staying green.
      # Three steps rather than one `run:` block: the pwsh wrapper only
      # propagates the LAST command's exit code, so a failing non-last
      # leg in a shared block would stay green.
      - name: Wintun address setup (privileged) — preferred addresses
        run: >-
          cargo nextest run -p meow-listener --features listener-tun --lib
          --run-ignored only --no-capture --retries 2 --no-tests=fail
          -E "test(=tun::windows_device::tests::addresses_are_preferred_and_replace_stale_ones)"

      - name: Wintun address setup (privileged) — inet6 none replaces both families
        run: >-
          cargo nextest run -p meow-listener --features listener-tun --lib
          --run-ignored only --no-capture --retries 2 --no-tests=fail
          -E "test(=tun::windows_device::tests::inet6_none_replaces_stale_addresses_of_both_families)"

      - name: Wintun address setup (privileged) — conflicted address left as found
        run: >-
          cargo nextest run -p meow-listener --features listener-tun --lib
          --run-ignored only --no-capture --retries 2 --no-tests=fail
          -E "test(=tun::windows_device::tests::conflicted_address_fails_and_leaves_the_adapter_as_found)"

  macos:
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos

      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@v4
        with:
          path: |
            ~/.install-action/bin/cargo-nextest*
            ~/.cargo/bin/cargo-nextest*
          # bump the -v1 suffix to refresh the cached binary.
          key: install-action-nextest-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore cargo-nextest PATH
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os != 'Windows'
        run: |
          echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore cargo-nextest PATH (Windows)
        if: steps.cache-nextest.outputs.cache-hit == 'true' && runner.os == 'Windows'
        run: |
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.install-action\bin"

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --tests

      - name: Core smoke tests
        run: |
          export MEOW_TEST_OUTBOUND_INTERFACE="$(route -n get default | awk '/interface:/ {print $2}')"
          test -n "$MEOW_TEST_OUTBOUND_INTERFACE"
          cargo nextest run --lib --bin meow --bin meow-bench --bin meow-cli \
            --test direct_udp_binding \
            --test common_test \
            --test config_test \
            --test rules_test \
            --test api_test \
            --test meow_cli_test \
            --test trojan_integration \
            --test tls_test \
            --test boring_tls_test \
            --test ws_test \
            --test crate_publish_metadata_test --test yaml_backend_test \
            --test yaml_boundary_test --retries 2 --no-fail-fast

      # `listener-tun` is not a default feature; this leg runs the tun
      # module's tests — notably the macOS regression guard that an unset
      # `tun.device` never invents a name (tun-rs rejects non-`utunN`).
      - name: meow-listener TUN tests (listener-tun)
        run: cargo nextest run -p meow-listener --features listener-tun --lib --retries 2 --no-fail-fast

      # The `no-macos-sendmsg-x` opt-out compiles the per-datagram
      # fallback back in; only a Darwin runner exercises that cfg —
      # on the Linux legs the feature is inert.
      - name: meow-wgstack clippy (no-macos-sendmsg-x opt-out)
        run: cargo clippy -p meow-wgstack --features no-macos-sendmsg-x --all-targets -- -D warnings

  tproxy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: TProxy integration tests
        env:
          MEOW_REQUIRE_DOCKER: "1"
        run: bash tests/test_tproxy_docker.sh

  # OpenWrt packaging and gateway e2e: native Docker router, origin and LAN
  # clients verify package installation, LuCI, lifecycle and TCP/UDP routing.
  openwrt:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      # The musl target must be added to the *pinned* toolchain cargo
      # resolves via rust-toolchain.toml — a `targets:` input on `@stable`
      # would install it on the wrong channel.
      - name: Read pinned toolchain channel
        id: tc
        # sed (not grep | sed): tolerates leading whitespace and a quoted
        # trailing comment, prints nothing on no match; the empty check
        # keeps a malformed toml fail-loud instead of writing `channel=`.
        run: |
          tc=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          if [ -z "$tc" ]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$tc" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          targets: x86_64-unknown-linux-musl

      # Keyed on the cargo-zigbuild pin, as in build.yml (see the comment
      # there).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: openwrt-e2e-zigbuild-0.23.2

      - name: Install cargo-zigbuild and zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      # Same pin as build.yml (see the comment there).
      - run: cargo install --locked cargo-zigbuild --version 0.23.2

      - name: OpenWrt Docker e2e tests
        env:
          MEOW_REQUIRE_DOCKER: "1"
        run: bash tests/test_openwrt_docker.sh

  # OpenWrt .apk packaging (apk-tools v3, OpenWrt 25.12+; #466): builds both
  # packages with build-apk.sh, checks them with `apk verify` / `apk adbdump`,
  # and installs them into a real OpenWrt 25.12 rootfs container.
  openwrt-apk:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Cache apk-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/apk-tools
          key: apk-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openwrt/install-apk-tools.sh') }}

      - name: Install apk-tools 3 (pinned)
        run: bash openwrt/install-apk-tools.sh "$HOME/.cache/apk-tools"

      - name: Build, verify and install the apks
        env:
          MEOW_REQUIRE_DOCKER: "1"
        run: |
          APK="$HOME/.cache/apk-tools/apk" bash tests/test_openwrt_apk.sh

  # ADR-0007 size gate before merge (see the 2026-10-28 addendum there).
  # Alpha runs build.yml on every push to main, and build.yml fails when the
  # aarch64-musl `minimal` binary is over its cap, so a PR that crosses the
  # cap used to turn main red only after merging (#802). This job runs the
  # same build on the PR's merge commit and the same check against the cap
  # it reads from build.yml.
  size:
    runs-on: ubuntu-latest
    needs: lint
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      # Same reasoning as the openwrt job: add the target to the pinned
      # toolchain, not to `@stable`.
      - name: Read pinned toolchain channel
        id: tc
        run: |
          tc=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          if [ -z "$tc" ]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$tc" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          targets: ${{ env.TARGET }}

      # Keyed on the cargo-zigbuild pin, as in build.yml (see the comment
      # there).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: size-${{ env.TARGET }}-zigbuild-0.23.2

      - name: Install cargo-zigbuild and zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      # Same pin as build.yml (see the comment there).
      - run: cargo install --locked cargo-zigbuild --version 0.23.2

      - name: Build minimal release binary
        run: |
          cargo zigbuild --release --locked \
            --no-default-features --features minimal \
            --target "$TARGET" \
            --bin meow

      - name: Minimal binary size check
        run: |
          # The cap and its gate class live on the target's matrix entry in
          # build.yml; read them from there so the two checks cannot drift.
          read -r cap soft < <(awk -v t="$TARGET" '
            $1 == "-" && $2 == "target:" { f = ($3 == t); next }
            f && $1 == "minimal_budget_bytes:" { cap = $2 }
            f && $1 == "minimal_soft_gate:" { soft = $2 }
            END { print cap, soft }
          ' .github/workflows/build.yml)
          case "$cap" in
            "" | 0 | *[!0-9]*)
              echo "::error::no minimal_budget_bytes for $TARGET in build.yml"
              exit 1
              ;;
          esac
          size=$(stat -c%s "target/$TARGET/release/meow")
          echo "$TARGET minimal: $size bytes, cap $cap bytes, headroom $((cap - size)) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$cap" ]; then
            if [ "$soft" = "true" ]; then
              echo "::warning::$TARGET minimal binary $size bytes exceeds soft budget $cap bytes (ADR-0007 §1)"
            else
              echo "::error::$TARGET minimal binary $size bytes exceeds hard budget $cap bytes by $((size - cap)) bytes (ADR-0007 §2)"
              exit 1
            fi
          fi
