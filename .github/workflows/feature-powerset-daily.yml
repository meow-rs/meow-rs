# Deeper feature-powerset compile checks, run nightly so they never block a
# PR. The PR-time `features` job in test.yml only checks combinations of up
# to two features (--depth 2, the same trade-off tokio and quinn make in
# their PR CI); this workflow pushes deeper: up to 4-feature combos for
# meow-proxy and meow-transport, and fully exhaustive powersets for the two
# small crates. rustls likewise keeps its powerset off the PR path
# (daily-tests.yml).
#
# The per-crate depths are runner budgets, not style. Leg counts below are
# what cargo-hack actually reports after deduplicating subsets that resolve
# to identical builds (feature implication collapses many of them, e.g.
# vless-vision -> vless, listener-mixed -> listener-http + listener-socks5):
#   meow-proxy      depth 4 = 1788 legs (the four split-out ss plugin
#                   features are grouped — see the matrix leg below;
#                   ungrouped they would blow the count up to 3676)
#   meow-transport  depth 4 = 747 legs (boring-tls excluded)
#   meow-listener   full powerset = 44 legs
#   meow-dns        full powerset = 5 legs
# With a warm cache each leg costs ~5-10s of incremental `cargo check`, so
# the heaviest job (meow-proxy, 1788 legs) lands around ~2.5-5h — inside
# the 360-minute hosted-runner cap the timeout below uses; a cold cache
# can run past it and get the job cancelled mid-powerset (legs already
# checked still report). An unbounded powerset of meow-proxy (2^20 ≈ 1M
# nominal legs) cannot fit a hosted runner at all, which is why depth is
# capped even on the nightly.
name: Feature Powerset (daily)

on:
  schedule:
    # 04:17 UTC daily — offset after coverage (02:17) and bench-daily (03:17)
    # to stagger shared-runner load and avoid scheduler congestion. Note that
    # GitHub only fires `schedule` from the default branch.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-powerset-daily
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  powerset:
    name: Powerset — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    # Scheduled workflows also fire on forks that enable Actions — the
    # powerset is the heaviest job in the repo; skip it on forks.
    if: github.event.repository.fork == false
    # ~2.59s per leg on the GitHub runner: grouped meow-proxy is 1788 legs
    # ≈ 77 min, and even ungrouped (3676 legs ≈ 159 min) still fits 180 —
    # keep the margin for machine variance, not for leg count.
    timeout-minutes: 180
    strategy:
      # One crate failing must not cancel the others: the point of the daily
      # run is to report every broken combination.
      fail-fast: false
      matrix:
        include:
          - crate: meow-proxy
            # The four opt-in ss plugin features are independent on/off
            # knobs by design, and no pair of them gates shared code —
            # each only gates its own `PluginKind` arm (they do share the
            # `plugin_util`/adapter cfg cluster with `ss` and `mux`, which
            # the ungrouped legs still explore). Treating them as one unit
            # drops the inter-plugin Cartesian product: the depth-4 leg
            # count falls 3676 -> 1788 (~2x) while still covering every
            # (plugin group, other feature) combination.
            hack_args: --depth 4 --group-features shadow-tls,restls,jls,gost-plugin
          - crate: meow-transport
            # `boring-tls` is a no-op alias of `tls` (BoringSSL is the only
            # backend); skip the duplicate leg.
            hack_args: --depth 4 --exclude-features boring-tls
          - crate: meow-listener
            hack_args: ""
          - crate: meow-dns
            hack_args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: powerset-daily

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # --no-dev-deps: dev-dependencies are irrelevant to a compile check and
      # dominate per-leg build time (rustls and quinn do the same).
      # --keep-going: collect every failing combination in one run instead of
      # stopping at the first (tokio uses it the same way).
      - name: Feature powerset — ${{ matrix.crate }}
        run: cargo hack check -p ${{ matrix.crate }} --feature-powerset --no-dev-deps --keep-going ${{ matrix.hack_args }}
