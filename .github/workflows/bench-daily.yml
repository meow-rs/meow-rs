name: Daily Benchmark

on:
  schedule:
    # 03:17 UTC daily (off the top of the hour to avoid scheduler congestion)
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Steady-state duration per workload (seconds, >= 3)"
        required: false
        type: number
        default: 30

permissions:
  contents: read
  # gh run download hits the artifacts API — required for the
  # day-over-day compare step.
  actions: read

concurrency:
  group: bench-daily
  cancel-in-progress: false

jobs:
  bench:
    name: Run benchmark harness (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Scheduled workflows also fire on forks that enable Actions — don't
    # burn fork owners' minutes on a daily trend only upstream reads.
    if: github.event.repository.fork == false
    env:
      # Pinned sing-box version — one source for the download URL and the
      # cache key. Keep in sync with test.yml and SINGBOX_VERSION in
      # crates/meow-app/tests/smux_singbox_integration.rs.
      SINGBOX_VERSION: "1.14.0"

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-daily-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-daily-${{ runner.os }}-

      - name: Build release binaries
        run: cargo build --release -p meow-app -p meow-bench

      - name: Cache sing-box binary
        id: cache-sing-box
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-peers/sing-box
          key: sing-box-${{ env.SINGBOX_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # Proxied-outbound workload (#558): sing-box is the VLESS server
      # half. The version pin lives in this job's env (see above); keep it
      # in sync with test.yml and SINGBOX_VERSION in
      # crates/meow-app/tests/smux_singbox_integration.rs.
      - name: Install sing-box (proxied workload server)
        run: |
          set -euo pipefail
          if [ ! -x "$RUNNER_TEMP/ci-peers/sing-box" ]; then
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/sing-box.tar.gz \
              "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
            tar -xzf /tmp/sing-box.tar.gz -C /tmp
            mkdir -p "$RUNNER_TEMP/ci-peers"
            cp "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" "$RUNNER_TEMP/ci-peers/sing-box"
          fi
          sudo install -m 755 "$RUNNER_TEMP/ci-peers/sing-box" /usr/local/bin/sing-box
          command -v sing-box

      - name: Run benchmark harness
        env:
          DURATION: ${{ github.event.inputs.duration || '30' }}
          # bench.sh uses `gh release download` to fetch the Go mihomo binary
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/bench
          # The whole target/ dir is cache-restored — drop stale results
          # so a failed run can't publish yesterday's numbers as today's
          # artifact (the summary/upload steps below run `if: always()`).
          rm -f target/bench/results.json target/bench/results.md \
            target/bench/reload.json target/bench/idle.json \
            target/bench/steady.json target/bench/criterion.txt
          bash bench.sh | tee target/bench/results.md

      # Criterion micro-benches (#558): meow-trie / meow-rules / meow-tunnel
      # hot paths. Short measurement windows — these feed day-over-day
      # trend signal, not absolute numbers.  Targets are named explicitly:
      # `cargo bench --workspace` alone would pass the criterion args to
      # every lib/bin test harness, which rejects them and aborts.  Note
      # `--bench rules_bench` intentionally matches BOTH
      # meow-rules/benches/rules_bench.rs and meow-tunnel/benches/rules_bench.rs
      # (9 binaries total) — the name-pin means a future new bench target
      # must be added to this list deliberately.
      - name: Run criterion micro-benches
        run: |
          cargo bench --workspace \
            --bench bloomcheck_vs_trie --bench trie_bench \
            --bench ipcidr_ruleset_bench --bench iprange_parser_bench \
            --bench regex_rules_bench --bench rules_bench \
            --bench stats_bench --bench udp_bench \
            -- --warm-up-time 1 --measurement-time 3 --sample-size 20 \
            | tee target/bench/criterion.txt

      - name: Publish results to run summary
        if: always()
        run: |
          {
            echo "## Daily benchmark — $(date -u +%F)"
            echo ""
            echo '```'
            cat target/bench/results.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch recent runs for day-over-day compare
        # Best-effort: a gh API blip must not fail the benchmark itself.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # $RUNNER_TEMP, not target/: the actions/cache above persists the
          # whole target/ dir, so prev/ under it would accumulate run dirs
          # from days ago and silently widen the median baseline past the
          # intended 5 most-recent runs.
          PREV="$RUNNER_TEMP/bench-prev"
          # Rebuild from scratch: hosted runners give a fresh temp per
          # job, but self-hosted runners may reuse it — never accumulate.
          rm -rf "$PREV" && mkdir -p "$PREV"
          gh run list --workflow "Daily Benchmark" --repo "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" --status success --limit 5 \
            --json databaseId --jq '.[].databaseId' | while read -r id; do
            # -p glob, not -n: artifact names carry a run-attempt suffix.
            gh run download "$id" --repo "$GITHUB_REPOSITORY" \
              -p "bench-daily-$id-*" -D "$PREV/$id" </dev/null 2>/dev/null || true
          done

      - name: Check regression vs baseline
        # Non-blocking: the checked-in baseline was measured on the dedicated
        # bench box (docs/benchmarks/hardware.md); GitHub-hosted runners are
        # slower and noisier, so absolute deltas are informational only —
        # same wide 20% threshold as the day-over-day check below, or this
        # step would flag nearly every run and train people to ignore it.
        if: hashFiles('docs/benchmarks/baseline-*.json') != ''
        continue-on-error: true
        run: |
          BASELINE=$(ls docs/benchmarks/baseline-*.json | sort | tail -1)
          python3 bench/compare.py "$BASELINE" target/bench/results.json --threshold 0.20

      - name: Check regression vs recent daily runs
        # Day-over-day signal: per-metric median of up to 5 previous
        # successful runs, 20% threshold — wide enough to ride over
        # hosted-runner noise while still catching a real regression.
        # Emits a workflow annotation rather than failing the job.
        continue-on-error: true
        run: |
          if [ ! -f target/bench/results.json ]; then
            echo "no results.json (bench run failed upstream); skipping compare"
          elif find "$RUNNER_TEMP/bench-prev" -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python3 bench/compare.py "$RUNNER_TEMP/bench-prev" target/bench/results.json --threshold 0.20 \
              || echo "::warning::benchmark regressed >20% vs recent-run median — see compare output"
          else
            echo "no previous artifacts found; skipping day-over-day compare"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # run_attempt in the name: artifact names are immutable and this
          # step runs `if: always()`, so a re-run of failed jobs would
          # otherwise 409 on "artifact already exists".
          name: bench-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/bench/results.json
            target/bench/results.md
            target/bench/reload.json
            target/bench/idle.json
            target/bench/steady.json
            target/bench/criterion.txt
          retention-days: 90
