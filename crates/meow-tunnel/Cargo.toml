[package]
name = "meow-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core routing engine (TCP/UDP relay, rule dispatch, connection statistics) for the meow-rs proxy kernel."
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
meow-common = { workspace = true }
meow-dns = { workspace = true, default-features = false }
meow-rules = { workspace = true }
meow-proxy = { workspace = true, default-features = false }
meow-trie = { workspace = true }
ipnet = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
smol_str = { workspace = true }
smallvec = { workspace = true }
# `SockRef::peek` — a raw `recv(..., MSG_PEEK)` for the non-unix
# peek-sniff arm, which must bypass tokio's readiness machinery (under
# IOCP a half-close can leave none behind).
socket2 = { workspace = true }
time = { workspace = true }
# `BytesMut`/`Bytes` — the WG zero-copy relay scratch (relay.rs's
# `Scratch::BytesMut`, perf-7 P7-1).
bytes = { workspace = true }
# `poll_read_buf` — fills a `BytesMut`'s uninitialized spare capacity
# straight from the reader, so the zero-copy path needs no per-fill
# memset (the `unsafe` boundary lives inside tokio-util).
tokio-util = { workspace = true, features = ["io"] }

# The relay splices socket-to-socket traffic (`relay::splice`).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[[bench]]
name = "udp_bench"
harness = false

[[bench]]
name = "rules_bench"
harness = false

[[bench]]
name = "stats_bench"
harness = false

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
meow-trie = { workspace = true }
criterion = { workspace = true }
dashmap = { workspace = true }
ipnet = { workspace = true }
meow-config = { workspace = true }
meow-rules = { workspace = true }
serde-saphyr = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
# The statistics tests record into a real traffic ledger.
meow-common = { workspace = true, features = ["traffic-ledger"] }

[lints]
workspace = true
