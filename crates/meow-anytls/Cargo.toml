# Vendored copy of the madeye fork of anytls-rs (github.com/madeye/anytls-rs),
# pinned at the commit that adds `Stream::close()` (madeye/anytls-rs#1,
# e6134889d3abbfaa2cb7439969dbda2ef6930611). Vendored in-tree to resolve #262:
# crates.io `anytls-rs@0.5.4` is jxo-me's UPSTREAM crate and lacks `close()`,
# so meow-proxy could not build the `anytls` feature against the registry.
#
# This crate uses Rust edition 2024, so package metadata is declared explicitly
# here rather than inherited from `[workspace.package]`.
#
# The package is renamed (`meow-anytls`) to avoid a crates.io name collision
# with the upstream `anytls-rs`, while the library name stays `anytls_rs` so
# dependents' `use anytls_rs::...` paths are unchanged.
[package]
name = "meow-anytls"
version = "0.22.0"
edition = "2024"
rust-version = "1.89"
description = "Vendored AnyTLS protocol implementation (madeye fork) for the meow-rs proxy kernel."
license = "MIT"
repository = "https://github.com/meow-rs/meow-rs"
homepage = "https://meow-rs.github.io/meow-rs/"
readme = "README.md"

[lib]
name = "anytls_rs"
path = "src/lib.rs"

[features]
default = []
# server: the AnyTLS *server* side (rustls acceptor, certificate hot-reload
# and analysis). meow ships only the client — whose TLS is supplied by the
# host through `util::tls::TlsConnect` (meow-transport's BoringSSL layer) —
# so this is off by default and is the only place rustls is used. Enabled by
# meow-proxy's dev-dependencies for the loopback integration tests.
server = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rcgen",
    "dep:notify",
    "dep:x509-parser",
    "dep:chrono",
]

[dependencies]
meow-common = { path = "../meow-common", version = "0.22.0" }
tokio = { version = "1.48", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "io-std",
    "net",
    "sync",
    "time",
    "signal",
    "fs",
] }

# Server-side TLS only (`server` feature): rustls acceptor + cert tooling.
# The client never touches rustls — see `util::tls::TlsConnect`.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }

bytes = "1.10.1"
tokio-util = { version = "0.7", features = ["codec", "rt"] }

sha2 = "0.10"
md5 = "0.8"

rand = "0.9"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.21"
socket2 = "0.6"
trust-dns-resolver = { version = "0.23", default-features = false, features = ["tokio-runtime"] }

thiserror = "2.0"
anyhow = "1.0"

notify = { version = "8.2", optional = true }
x509-parser = { version = "0.18", optional = true }
chrono = { version = "0.4", optional = true }

# libc is only used by the Android socket-protect helper (EINPROGRESS check on
# the non-blocking connect). Off-Android the helper compiles down to a direct
# `TcpStream::connect` / `UdpSocket::bind` and the dep is never pulled in.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
# `test-util` adds tokio::time::pause/advance + `start_paused` for the
# session watchdog tests (the real 3 s deadline would slow the suite).
tokio = { version = "1.48", features = ["test-util"] }
