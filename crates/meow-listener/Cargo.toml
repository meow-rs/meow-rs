[package]
name = "meow-listener"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Inbound protocol listeners (Mixed/HTTP/SOCKS5/TProxy/TUN) for the meow-rs proxy kernel."
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["listener-http", "listener-socks5", "listener-mixed", "listener-tproxy"]
listener-http = []
listener-socks5 = []
listener-tproxy = []
listener-mixed = ["listener-http", "listener-socks5"]
# lwIP from libc malloc instead of static pools (meow-lwip `libc-malloc`).
# Weak dep — silently inert unless `listener-tun` also pulls lwip in.
lwip-libc-malloc = ["lwip?/libc-malloc"]
# TUN inbound (issue #326) — transparent proxy on platforms without a
# tproxy/REDIRECT firewall (Windows). Off by default: pulls in the device,
# userspace-stack, and route-control deps below.
listener-tun = [
    "dep:tun-rs",
    "dep:boring",
    "dep:lwip",
    "dep:futures",
    "dep:route_manager",
    "dep:meow-dns",
    "dep:ipnet",
    "dep:windows-sys",
    "dep:netlink-packet-core",
    "dep:netlink-packet-route",
    "dep:netlink-sys",
]
# Shadowsocks encrypted-server inbound. Reuses the `shadowsocks` crate's
# server-side ProxyListener/ProxySocket (the same crate already used by the
# outbound `ss` adapter) and the shared simple-obfs codec from meow-transport.
# Off by default in this crate; the app's `full` bundle (the release
# binaries) turns it on, `minimal` leaves it out.
listener-shadowsocks = [
    "dep:shadowsocks",
    "dep:meow-transport",
    "meow-transport/simple-obfs",
]
# WireGuard inbound (`listeners: - type: wireguard`): meow is the WG
# responder on one UDP port serving a static peer table; inner TCP flows
# are terminated by a smoltcp userspace stack, inner UDP by a per-flow
# dial_udp path — semantically a TUN inbound carried over WireGuard.
# Opt-in (the app's `full` bundle carries it, `minimal` does not). The
# `meow-dns` edge is for the snooping-table `prefill_host` the TCP tail
# shares with the TUN inbound; `smoltcp` is a direct dep because the
# actor holds Interface/SocketSet/TcpSocket itself rather than going
# through meow-wgstack.
listener-wireguard = [
    "dep:meow-wireguard",
    "meow-wireguard/wireguard-boring",
    "dep:meow-wgstack",
    "dep:smoltcp",
    "dep:ipnet",
    "dep:bytes",
    "dep:meow-dns",
    "dep:rand",
]

[dependencies]
meow-common = { workspace = true }
meow-trie = { workspace = true }
meow-tunnel = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Accepted-socket TCP keepalive (`keepalive::apply`) — unconditional: the
# helper is `#[cfg]`-gated internally per platform, not dep-gated.
socket2 = { workspace = true }
libc = "0.2"
smallvec = { workspace = true }
smol_str = { workspace = true }
tun-rs = { workspace = true, optional = true }
lwip = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
route_manager = { workspace = true, optional = true }
meow-dns = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
# listener-wireguard: vendored boringtun noise (responder side) + the
# smoltcp/tokio plumbing shared with the WG outbound pump. The actor
# itself holds smoltcp types, so smoltcp is a direct optional dep.
meow-wireguard = { workspace = true, optional = true }
meow-wgstack = { workspace = true, optional = true }
smoltcp = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# listener-wireguard: the smoltcp interface's ISN/ephemeral-port seed.
rand = { workspace = true, optional = true }
# listener-shadowsocks
shadowsocks = { workspace = true, optional = true }
# listener-tun: QUIC Initial decryption for the QUIC sniffer (the same
# BoringSSL every TLS path links).
boring = { workspace = true, optional = true }
meow-transport = { workspace = true, optional = true }
parking_lot.workspace = true

[dev-dependencies]
meow-config = { workspace = true }
meow-rules = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
meow-dns = { workspace = true }
meow-trie = { workspace = true }
ipnet = { workspace = true }
shadowsocks = { workspace = true }
async-trait = { workspace = true }
tracing-subscriber = { workspace = true }
smol_str = { workspace = true }
# wireguard_listener.rs: the outbound adapter is the in-process WG
# client driving the listener over loopback UDP.
meow-proxy = { workspace = true, features = ["wireguard"] }
x25519-dalek = { workspace = true }
base64 = { workspace = true }

# listener-tun: the Wintun adapter's addresses are assigned through IP
# Helper (`tun/windows_device.rs`) so they come up Preferred, not tentative.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", optional = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# listener-tun: global auto-route installs policy rules and a routing table
# of its own over rtnetlink (`tun/policy_route.rs`). The same versions
# route_manager already pulls in on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = { version = "0.9", optional = true }
netlink-packet-route = { version = "0.33", optional = true }
netlink-sys = { version = "0.8", optional = true }

[[test]]
name = "ss_listener_integration"
required-features = ["listener-shadowsocks"]

[[test]]
name = "wireguard_listener"
required-features = ["listener-wireguard"]

[lints]
workspace = true
